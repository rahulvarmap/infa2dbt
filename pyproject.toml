[project]
name = "infa2dbt"
version = "0.1.0"
description = "FastAPI backend for the Informatica to dbt XML uploader"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
repl-nix-workspace = "repl_nix_workspace:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
