[project]
name = "infa2dbt"
version = "0.1.0"
description = "FastAPI backend for the Informatica to dbt XML uploader"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pytest>=9.2.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
