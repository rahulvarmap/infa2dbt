kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "python ../infa2dbt/api/serve.py"

[services.production]

[services.production.build]
args = ["bash", "scripts/install-infa2dbt-python-deps.sh"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["bash", "scripts/run-infa2dbt-api.sh"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/ready"
kind = "web"
